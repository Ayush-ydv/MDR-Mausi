<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDR Mausi wants her cut | Bachat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3DCC8; --bg2:#FBEBDD; --card:#FFF8F0; --ink:#2B1B17; --muted:#6B5249;
  --saree:#C8283B; --haldi:#F2B632; --mint:#8FD6B5; --sky:#9CC9F0; --pink:#F4A6A0;
  --shadow:4px 4px 0 var(--ink);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2A1E1B; --bg2:#342622; --card:#3E2E29; --ink:#FBEBDD; --muted:#CDB6AA;
    --saree:#EF5566; --haldi:#F5C04C; --mint:#6CC79E; --sky:#78B2E6; --pink:#E0877F;
  }
}
:root[data-theme="dark"]{
  --bg:#2A1E1B; --bg2:#342622; --card:#3E2E29; --ink:#FBEBDD; --muted:#CDB6AA;
  --saree:#EF5566; --haldi:#F5C04C; --mint:#6CC79E; --sky:#78B2E6; --pink:#E0877F;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.5 "Baloo 2",system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 12%,transparent) 1.5px,transparent 1.6px);background-size:22px 22px}
h1,h2,h3{font-family:"Bagel Fat One","Baloo 2",system-ui,sans-serif;font-weight:400;line-height:1.02;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--haldi);outline-offset:3px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}

.btn{background:var(--haldi);color:#2B1B17;border:3px solid var(--ink);border-radius:14px;padding:8px 16px;font-weight:800;cursor:pointer;box-shadow:var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.red{background:var(--saree);color:#fff}
.btn.mint{background:var(--mint)}
.btn.sky{background:var(--sky)}
.btn.plain{background:var(--card);color:var(--ink)}

/* nav */
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.logo{font-family:"Bagel Fat One",sans-serif;font-size:1.7rem;display:flex;align-items:center;gap:8px}
.logo i{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--haldi);border:3px solid var(--ink);font-style:normal;color:#2B1B17;font-size:1.1rem;transform:rotate(-12deg)}

/* hero */
.hero{display:grid;grid-template-columns:1fr 1.05fr;gap:10px;align-items:center;padding:10px 0 0}
.hero h1{font-size:clamp(3rem,7.5vw,5.6rem);letter-spacing:-.01em}
.hero h1 .l2{display:block;color:var(--saree);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
.hero p{font-size:1.15rem;max-width:34ch;margin:14px 0 20px;color:var(--muted);font-weight:600}
.stageWrap{position:relative;height:min(620px,72vh);min-height:420px}
.stage{position:absolute;inset:0;cursor:pointer}
.stage canvas{display:block;width:100%!important;height:100%!important}
.halo{position:absolute;left:50%;top:48%;width:78%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:var(--haldi);border:4px solid var(--ink);opacity:.9}
.halo::after{content:"";position:absolute;inset:18px;border-radius:50%;border:4px dashed var(--ink);opacity:.35;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bubble{position:absolute;left:0;top:6%;max-width:230px;background:var(--card);border:3px solid var(--ink);border-radius:22px;padding:10px 14px;font-weight:800;box-shadow:var(--shadow);z-index:3;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.bubble::after{content:"";position:absolute;right:-18px;top:34px;border:10px solid transparent;border-left:16px solid var(--ink)}
@keyframes pop{from{transform:scale(.4) rotate(-8deg);opacity:0}}
.hint{position:absolute;right:4px;bottom:8px;font-size:.85rem;font-weight:700;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;z-index:3}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:700;padding:30px}

/* scoreboard */
.score{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.chip{background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 14px;box-shadow:var(--shadow);min-width:150px}
.chip b{display:block;font-family:"Bagel Fat One",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.1}
.chip.fee b{color:var(--saree)}
.chip.save b{color:#1f8a57}
:root[data-theme="dark"] .chip.save b{color:var(--mint)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.save b{color:var(--mint)}}
.chip span{font-size:.85rem;font-weight:700;color:var(--muted)}

/* street */
.street{position:relative;margin-top:-10px;background:var(--bg2);border:4px solid var(--ink);border-radius:28px;padding:22px 18px 18px;box-shadow:6px 6px 0 var(--ink)}
.street h2{font-size:1.8rem;margin-bottom:4px}
.street .sub{margin:0 0 14px;color:var(--muted);font-weight:600}
.shops{display:grid;grid-template-columns:repeat(3,1fr) .8fr;gap:16px;align-items:end}
.shop{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.shop:nth-child(1){transform:rotate(-1.5deg)}
.shop:nth-child(3){transform:rotate(1.2deg)}
.shop svg{width:120px;height:130px;display:block;margin:0 auto}
.shop.bounce svg{animation:hop .45s}
@keyframes hop{40%{transform:translateY(-14px) rotate(-4deg)}}
.shop h3{font-size:1.2rem;margin-top:4px}
.amt{font-weight:800;font-size:1.05rem}
.shop .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.shop .btn{padding:5px 10px;font-size:.92rem}
.vault{text-align:center}
.vault svg{width:130px;height:150px}
.vault.glow svg{animation:hop .45s}
.vault b{display:block;font-weight:800}

/* coins */
.coin{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--haldi);border:3px solid #2B1B17;display:grid;place-items:center;font-weight:800;color:#2B1B17;z-index:50;pointer-events:none;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.coin.note{width:64px;height:34px;margin:-17px 0 0 -32px;border-radius:6px;background:var(--mint);font-size:.8rem}

/* sections */
section.block{padding:70px 0 10px}
.kicker{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-weight:800;transform:rotate(-2deg);margin-bottom:10px}
.block h2{font-size:clamp(2.1rem,5vw,3.3rem);max-width:18ch}
.block .lede{max-width:56ch;color:var(--muted);font-weight:600;margin:10px 0 24px}

/* calculator */
.calc{display:grid;grid-template-columns:1.2fr .8fr;gap:22px;background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:24px;box-shadow:6px 6px 0 var(--ink)}
.bigamt{font-family:"Bagel Fat One",sans-serif;font-size:clamp(2.4rem,6vw,3.6rem);line-height:1}
input[type=range]{width:100%;accent-color:var(--saree);height:32px;margin:14px 0 4px}
.numin{width:170px;border:3px solid var(--ink);border-radius:12px;padding:6px 10px;background:var(--bg2);font-weight:800}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.presets .btn{padding:3px 10px;font-size:.9rem;box-shadow:2px 2px 0 var(--ink)}
.receipt{margin-top:18px;border-top:3px dashed var(--ink);padding-top:12px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-weight:700}
.receipt .t{font-size:1.25rem;border-top:3px solid var(--ink);padding-top:6px}
.reaction{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
.reaction svg{width:190px;height:190px}
.reaction .say{background:var(--bg2);border:3px solid var(--ink);border-radius:18px;padding:8px 12px;font-weight:800;margin-top:6px;min-height:3.2em}

/* trick */
.trick{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}
.panel{background:var(--card);border:4px solid var(--ink);border-radius:28px;padding:22px;box-shadow:6px 6px 0 var(--ink);position:relative;overflow:hidden}
.panel.alarm{animation:shake .5s 2;background:color-mix(in srgb,var(--saree) 18%,var(--card))}
@keyframes shake{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}
.slips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.slip{border:3px solid var(--ink);border-radius:10px;background:var(--mint);padding:4px 10px;font-weight:800;animation:pop .3s both}
.siren{position:absolute;right:16px;top:14px;width:48px;height:48px;border-radius:50% 50% 8px 8px;border:3px solid var(--ink);background:#888}
.alarm .siren{animation:flash .3s steps(2) infinite}
@keyframes flash{0%{background:var(--saree)}100%{background:var(--sky)}}
.verdict{border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:700;margin-top:10px;background:var(--bg2)}

/* comics */
.comics{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.comic{background:var(--card);border:4px solid var(--ink);border-radius:8px;padding:0;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.comic .art{height:150px;border-bottom:4px solid var(--ink);display:grid;place-items:center}
.comic:nth-child(1) .art{background:var(--pink)}
.comic:nth-child(2) .art{background:var(--mint)}
.comic:nth-child(3) .art{background:var(--sky)}
.comic .art svg{height:120px}
.comic .txt{padding:14px 16px 18px}
.comic h3{font-size:1.35rem;margin-bottom:6px}
.comic p{margin:0;color:var(--muted);font-weight:600}
.comic .num{display:inline-block;background:var(--haldi);color:#2B1B17;border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;text-align:center;line-height:28px;font-weight:800;margin-bottom:6px}

/* cta */
.cta{margin:70px 0 30px;background:var(--saree);color:#fff;border:4px solid var(--ink);border-radius:32px;padding:34px 26px;box-shadow:8px 8px 0 var(--ink);text-align:center}
.cta h2{font-size:clamp(2rem,5vw,3.2rem);-webkit-text-stroke:1px #2B1B17;margin:0 auto;max-width:18ch}
.cta p{font-weight:600;margin:10px auto 18px;max-width:46ch}
.cta form{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cta input{border:3px solid #2B1B17;border-radius:14px;padding:8px 14px;min-width:240px;background:#FFF8F0;color:#2B1B17;font-weight:700}
.thanks{font-family:"Bagel Fat One",sans-serif;font-size:1.6rem}
footer{padding:10px 0 40px;color:var(--muted);font-size:.9rem;font-weight:600}
footer p{max-width:80ch}

@media (max-width:900px){
  .hero{grid-template-columns:1fr}
  .stageWrap{height:460px;min-height:0}
  .shops{grid-template-columns:1fr 1fr}
  .calc,.trick{grid-template-columns:1fr}
  .comics{grid-template-columns:1fr}
  .bubble{max-width:180px;font-size:.95rem}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if (!window.React || !window.ReactDOM){
  document.getElementById("root").innerHTML = '<p style="padding:40px;font-weight:700">The page scripts did not load. Check your connection and reload.</p>';
  return;
}
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useRef = React.useRef;
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function inr(n){ return "₹" + (Math.round(n*100)/100).toLocaleString("en-IN",{maximumFractionDigits:2}); }
function feeOf(a){ return a > 2000 ? Math.min(a*0.004, 300) : 0; }
function moodFor(a){ if (a <= 2000) return "pout"; if (a >= 75000) return "shocked"; return "greedy"; }
function lineFor(a){
  if (a <= 2000) return "Only " + inr(a) + "? Nothing for Mausi. Hmph.";
  if (a >= 75000) return "What?! Capped at ₹300? Who made this rule!";
  return "Ahh, " + inr(a) + "! My 0.4% is " + inr(feeOf(a)) + ", beta.";
}

/* ================= 3D MAUSI ================= */
var EXPR = {
  smug:    { lid: 0.02, eye:1.0,  brow:[ 0.12,-0.12], browY:0.00, mouth:"smile", pupil:0x3a2418 },
  greedy:  { lid:-0.55, eye:1.05, brow:[-0.28, 0.28], browY:0.02, mouth:"grin",  pupil:0xE0A10E },
  shocked: { lid:-1.45, eye:1.22, brow:[ 0.18,-0.18], browY:0.16, mouth:"open",  pupil:0x3a2418 },
  pout:    { lid:-0.35, eye:1.0,  brow:[ 0.05,-0.40], browY:0.05, mouth:"pout",  pupil:0x3a2418 },
  sly:     { lid: 0.25, eye:1.0,  brow:[-0.30, 0.05], browY:0.00, mouth:"smirk", pupil:0x3a2418 },
  worried: { lid:-1.25, eye:1.2,  brow:[ 0.38,-0.38], browY:0.10, mouth:"frown", pupil:0x3a2418 }
};
var EXPR_ORDER = ["smug","greedy","shocked","pout","sly","worried"];

function MausiScene(props){
  var mount = useRef(null);
  var api = useRef({});
  var _s = useState(false), failed = _s[0], setFailed = _s[1];

  useEffect(function(){
    var el = mount.current;
    if (!window.THREE){ setFailed(true); return; }
    var renderer;
    try { renderer = new THREE.WebGLRenderer({antialias:true, alpha:true}); }
    catch(e){ setFailed(true); return; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    el.appendChild(renderer.domElement);

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(33, 1, 0.1, 100);
    camera.position.set(0, 0.1, 10.2);
    camera.lookAt(0, -0.55, 0);
    scene.add(new THREE.HemisphereLight(0xfff4e6, 0x6b4a3a, 0.75));
    var sun = new THREE.DirectionalLight(0xffffff, 0.75);
    sun.position.set(3, 5, 6); scene.add(sun);

    var gd = new Uint8Array([95, 175, 255]);
    var grad = new THREE.DataTexture(gd, 3, 1, THREE.LuminanceFormat);
    grad.minFilter = THREE.NearestFilter; grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
    function toon(c){ return new THREE.MeshToonMaterial({color:c, gradientMap:grad}); }
    function flat(c){ return new THREE.MeshBasicMaterial({color:c}); }
    var ink = new THREE.MeshBasicMaterial({color:0x2B1B17, side:THREE.BackSide});
    var disposables = [];
    function add(geo, mat, parent, pos, scl, outline){
      disposables.push(geo);
      var m = new THREE.Mesh(geo, mat);
      if (pos) m.position.set(pos[0],pos[1],pos[2]);
      if (scl) m.scale.set(scl[0],scl[1],scl[2]);
      parent.add(m);
      if (outline){ var o = new THREE.Mesh(geo, ink); o.scale.setScalar(outline); m.add(o); }
      return m;
    }

    var SKIN = 0xB8693F, SKIN_D = 0xA25A35, HAIR = 0xDAD6CF, SAREE = 0xC8283B, GOLD = 0xF2B632;
    var skin = toon(SKIN), skinD = toon(SKIN_D), hair = toon(HAIR), saree = toon(SAREE), gold = toon(GOLD);
    var white = flat(0xffffff), dark = flat(0x4A1519), lip = toon(0x8E3434), tongue = flat(0xE0707A);
    var pupilMat = flat(0x3a2418);
    var cheekMat = new THREE.MeshBasicMaterial({color:0xF08A7E, transparent:true, opacity:0.55});

    var root = new THREE.Group(); root.position.y = 0.45; scene.add(root);

    // body
    var body = new THREE.Group(); body.position.y = -2.55; root.add(body);
    add(new THREE.CylinderGeometry(0.72, 1.8, 2.5, 40), saree, body, [0,0,0], null, 1.03);
    var pallu = add(new THREE.BoxGeometry(0.62, 2.9, 0.12), toon(0x9E1B2C), body, [0.18, 0.05, 1.1]);
    pallu.rotation.set(-0.38, 0, -0.55);
    var border1 = add(new THREE.BoxGeometry(0.1, 2.9, 0.14), gold, pallu, [0.3, 0, 0.01]);
    var border2 = add(new THREE.BoxGeometry(0.1, 2.9, 0.14), gold, pallu, [-0.3, 0, 0.01]);
    add(new THREE.TorusGeometry(1.76, 0.08, 8, 48), gold, body, [0,-1.2,0]).rotation.x = Math.PI/2;
    add(new THREE.CylinderGeometry(0.34, 0.46, 0.9, 24), skin, root, [0,-1.2,0], null, 1.06);

    // head
    var head = new THREE.Group(); root.add(head);
    add(new THREE.SphereGeometry(1.1, 40, 32), skin, head, [0,0,0], [1,1.08,1], 1.035);
    [-1,1].forEach(function(s){ add(new THREE.SphereGeometry(0.2, 16, 12), skinD, head, [s*1.07, 0, -0.05], [0.5,1,0.8], 1.1); });

    // hair curls
    var n = 110, golden = Math.PI*(3-Math.sqrt(5)), seed = 3;
    function rnd(){ seed = (seed*9301+49297)%233280; return seed/233280; }
    for (var i=0;i<n;i++){
      var y = 1 - (i/(n-1))*2, r = Math.sqrt(1-y*y), th = golden*i;
      var x = Math.cos(th)*r, z = Math.sin(th)*r;
      var keep = (y > 0.42) || (z < -0.15 && y > -0.55) || (Math.abs(x) > 0.82 && y > 0.05 && z < 0.35);
      if (z > 0.5 && y < 0.62) keep = false;
      if (!keep) continue;
      var rad = 1.13 + rnd()*0.06, cr = 0.24 + rnd()*0.13;
      add(new THREE.SphereGeometry(cr, 14, 10), hair, head, [x*rad, y*rad*1.08, z*rad], null, 1.09);
    }
    add(new THREE.SphereGeometry(0.52, 20, 16), hair, head, [0, 0.55, -1.0], null, 1.06);
    [-1,1].forEach(function(s){
      for (var k=0;k<6;k++){
        var cr = 0.27 - k*0.012;
        add(new THREE.SphereGeometry(cr, 14, 10), hair, head,
          [s*(0.92 + Math.sin(k*1.7)*0.1), -0.25 - k*0.3, -0.45 + Math.cos(k*1.3)*0.12], null, 1.09);
      }
    });

    // face
    add(new THREE.SphereGeometry(0.13, 16, 12), skinD, head, [0,-0.14,1.12], [1,1.1,1], 1.1);
    add(new THREE.SphereGeometry(0.05, 12, 8), flat(0xB0142A), head, [0,0.37,1.02]);
    [-1,1].forEach(function(s){
      var c = add(new THREE.SphereGeometry(0.17, 16, 12), cheekMat, head, [s*0.6,-0.22,0.88], [1,0.7,0.3]);
      c.rotation.y = s*0.6;
    });

    var eyes = [], lids = [], pupils = [], brows = [];
    var irisGeo = new THREE.CircleGeometry(0.105, 24), hiGeo = new THREE.CircleGeometry(0.032, 12);
    disposables.push(irisGeo, hiGeo);
    [-1,1].forEach(function(s){
      var eg = new THREE.Group(); eg.position.set(s*0.38, 0.12, 0.93); eg.rotation.y = s*0.28;
      head.add(eg);
      var inner = new THREE.Group(); inner.scale.set(1,1,0.55); eg.add(inner);
      add(new THREE.SphereGeometry(0.24, 24, 18), white, inner, null, null, 1.1);
      var pg = new THREE.Group(); inner.add(pg);
      var iris = new THREE.Mesh(irisGeo, pupilMat); pg.add(iris);
      var hi = new THREE.Mesh(hiGeo, white); hi.position.set(0.035,0.04,0.002); pg.add(hi);
      var lid = add(new THREE.SphereGeometry(0.255, 24, 12, 0, Math.PI*2, 0, Math.PI/2), skin, inner, null, null, 1.04);
      eyes.push(eg); lids.push(lid); pupils.push(pg);
      var b = add(new THREE.BoxGeometry(0.44, 0.08, 0.08), toon(0x8E8A84), head, [s*0.38, 0.47, 0.96], null, 1.15);
      brows.push(b);
    });

    // mouths
    var mouth = new THREE.Group(); mouth.position.set(0,-0.53,1.0); mouth.rotation.x = 0.5; head.add(mouth);
    var mouths = {};
    mouths.smile = add(new THREE.TorusGeometry(0.2,0.04,8,24,Math.PI), lip, mouth); mouths.smile.rotation.z = Math.PI;
    mouths.grin = new THREE.Group(); mouth.add(mouths.grin);
    add(new THREE.CircleGeometry(0.28,32,Math.PI,Math.PI), dark, mouths.grin);
    add(new THREE.PlaneGeometry(0.46,0.09), white, mouths.grin, [0,-0.05,0.004]);
    mouths.open = new THREE.Group(); mouth.add(mouths.open);
    add(new THREE.SphereGeometry(0.2,20,16), dark, mouths.open, [0,-0.05,0], [1,1.3,0.35], 1.08);

function flyCoins(fromEl, toEl, label, count, onLand){
  if (!fromEl || !toEl){ onLand && onLand(); return; }
  var a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  var x0 = a.left + a.width/2, y0 = a.top + a.height/2;
  var x1 = b.left + b.width/2, y1 = b.top + b.height*0.42;
  if (reduceMotion){ onLand && onLand(); return; }
  var landed = false;
  for (var i=0;i<count;i++){
    (function(i){
      var c = document.createElement("div");
      c.className = "coin" + (label.length > 2 ? " note" : "");
      c.textContent = label;
      document.body.appendChild(c);
      var mx = (x0+x1)/2 + (i-1)*30, my = Math.min(y0,y1) - 140 - i*20;
      var anim = c.animate([
        {transform:"translate("+x0+"px,"+y0+"px) scale(.6) rotate(0deg)"},
        {transform:"translate("+mx+"px,"+my+"px) scale(1.15) rotate(200deg)", offset:0.5},
        {transform:"translate("+x1+"px,"+y1+"px) scale(.5) rotate(400deg)", opacity:.2}
      ], {duration:850, delay:i*120, easing:"cubic-bezier(.4,.1,.6,1)", fill:"both"});
      anim.onfinish = function(){
        c.remove();
        if (!landed){ landed = true; onLand && onLand(); }
      };
    })(i);
  }
}
